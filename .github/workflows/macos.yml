name: macOS

# Two-stage release model: the build job creates a short-lived, ad-hoc-signed
# transport artifact with full provenance. The sign job then runs the same
# packaging/macos/release.py used for local releases — Developer ID signing,
# notarization, and stapling on the runner, with the identity imported from
# repo secrets into a throwaway keychain. On tags the signed DMG is attached
# to the GitHub release. release.py still works locally as a fallback; CI and
# local releases share one code path.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character commit SHA to build
        required: true
        type: string
  push:
    branches: [macos-build]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned macOS arm64 app
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact source and runner architecture
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual_sha" = "$EXPECTED_SHA"
          fi
          test "$(uname -m)" = "arm64"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            packaging/macos/requirements-build.txt

      - name: Read and validate application version
        run: |
          set -euo pipefail
          APP_VERSION="$(python -c 'from app import __version__; print(__version__)')"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$APP_VERSION"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_BASENAME=SlowBooksPro-${APP_VERSION}-macos-arm64" >> "$GITHUB_ENV"

      - name: Install WeasyPrint native dependencies
        run: |
          brew install pango fontconfig gobject-introspection
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install Python and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-desktop.txt \
            -r packaging/macos/requirements-build.txt

      - name: Build the application icon
        run: |
          python packaging/macos/build_icon.py \
            assets/icon-256.png "$RUNNER_TEMP/SlowBooksPro.iconset"
          iconutil -c icns "$RUNNER_TEMP/SlowBooksPro.iconset" \
            -o packaging/macos/slowbookspro.icns

      - name: Build the app with PyInstaller
        run: |
          cd packaging/macos
          pyinstaller --noconfirm --clean SlowBooksPro-mac.spec

      - name: Validate the frozen bundle
        run: |
          set -euo pipefail
          app="packaging/macos/dist/SlowBooks Pro.app"
          # Hosted and File Provider workspaces can add Finder/resource-fork
          # xattrs after PyInstaller's ad-hoc signing. They are not bundle
          # content and make strict codesign verification reject the app.
          # PyInstaller also cross-links binaries back into Resources for
          # compatibility; Apple's notarization preflight follows those links
          # and rejects the apparent Mach-O files in Resources.
          python packaging/macos/prepare_bundle.py "$app"
          find "$app" -exec xattr -c {} +
          # Removing those sealed symlinks invalidates only PyInstaller's outer
          # ad-hoc transport signature. Refresh that outer signature without
          # recursive signing; local Developer ID signing replaces it later.
          codesign --force --sign - "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - \
            "$app/Contents/Info.plist")" = "$APP_VERSION"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - \
            "$app/Contents/Info.plist")" = "14.0"
          test "$(lipo -archs "$app/Contents/MacOS/SlowBooksPro")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$app"
          python packaging/macos/audit_bundle.py "$app" \
            --expected-arch arm64 \
            --output "$RUNNER_TEMP/native-linkage.txt"

      - name: Smoke test the frozen bundle
        timeout-minutes: 8
        env:
          SLOWBOOKS_DATA_DIR: ${{ runner.temp }}/slowbooks-smoke/data
        run: |
          set +e
          "packaging/macos/dist/SlowBooks Pro.app/Contents/MacOS/SlowBooksPro" \
            --smoke-test
          status=$?
          set -e
          log="$SLOWBOOKS_DATA_DIR/launcher.log"
          if [[ -f "$log" ]]; then
            cat "$log"
          else
            echo "No launcher.log was written."
          fi
          exit "$status"

      - name: Package unsigned transport artifacts and provenance
        run: |
          set -euo pipefail
          app="packaging/macos/dist/SlowBooks Pro.app"
          artifact_dir="$RUNNER_TEMP/macos-artifact"
          stage="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$artifact_dir" "$stage"

          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$artifact_dir/${BUILD_BASENAME}-unsigned-app.zip"
          ditto "$app" "$stage/SlowBooks Pro.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "SlowBooks Pro" \
            -srcfolder "$stage" -ov -format UDZO \
            "$artifact_dir/${BUILD_BASENAME}-unsigned.dmg"

          unzip -tq "$artifact_dir/${BUILD_BASENAME}-unsigned-app.zip"
          hdiutil verify "$artifact_dir/${BUILD_BASENAME}-unsigned.dmg"
          cp "$RUNNER_TEMP/native-linkage.txt" "$artifact_dir/native-linkage.txt"
          python -m pip freeze --all > "$artifact_dir/pip-freeze.txt"
          brew list --versions pango fontconfig gobject-introspection \
            glib harfbuzz > "$artifact_dir/brew-packages.txt"

          {
            echo "format_version=1"
            echo "git_sha=$GITHUB_SHA"
            echo "app_version=$APP_VERSION"
            echo "architecture=$(uname -m)"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "github_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "python=$(python --version 2>&1)"
          } > "$artifact_dir/build-info.txt"

          (
            cd "$artifact_dir"
            shasum -a 256 \
              "${BUILD_BASENAME}-unsigned-app.zip" \
              "${BUILD_BASENAME}-unsigned.dmg" \
              build-info.txt \
              brew-packages.txt \
              native-linkage.txt \
              pip-freeze.txt > SHA256SUMS
          )

      - name: Upload exact-commit unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlowBooksPro-macos-arm64-${{ github.sha }}-unsigned
          path: ${{ runner.temp }}/macos-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign:
    name: Sign, notarize, and staple
    needs: build
    # Signing secrets exist only in the canonical repo; forks build unsigned.
    if: github.repository == 'VonHoltenCodes/SlowBooks-Pro-2026'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: SlowBooksPro-macos-arm64-${{ github.sha }}-unsigned
          path: ${{ runner.temp }}/macos-artifact

      - name: Import Developer ID certificate into a throwaway keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Make the throwaway keychain the default so both codesign's
          # identity search and notarytool's credential profile land in it.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials slowbooks-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Sign, notarize, and staple via release.py
        run: |
          set -euo pipefail
          cd packaging/macos
          python3 release.py "$RUNNER_TEMP/macos-artifact" \
            --expected-sha "$GITHUB_SHA" \
            --output-root "$RUNNER_TEMP/release-out"

      - name: Stage signed DMG and release evidence
        run: |
          set -euo pipefail
          report_dir="$(find "$RUNNER_TEMP/release-out" -mindepth 1 -maxdepth 1 -type d)"
          dmg="$(find "$report_dir" -maxdepth 1 -name 'SlowBooksPro-*-macos-arm64.dmg')"
          test -f "$dmg"
          stage="$RUNNER_TEMP/signed-stage"
          mkdir -p "$stage"
          cp "$dmg" "$stage/"
          # Stable asset name: the website's direct-download links depend on it.
          cp "$dmg" "$stage/SlowBooksPro-macos-arm64.dmg"
          cp "$report_dir/SHA256SUMS" "$stage/SHA256SUMS.macos"
          tar -czf "$stage/release-evidence.tar.gz" --exclude='*.dmg' \
            -C "$(dirname "$report_dir")" "$(basename "$report_dir")"
          ls -la "$stage"

      - name: Delete throwaway keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # The evidence reports are the only way to debug a policy/notary
      # failure — the DMG-free report directory is small, upload it always.
      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-out/
            !${{ runner.temp }}/release-out/**/*.dmg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlowBooksPro-macos-arm64-${{ github.sha }}-signed
          path: ${{ runner.temp }}/signed-stage/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Attach signed DMG to release
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: SlowBooksPro-macos-arm64-${{ github.sha }}-signed
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SlowBooksPro-*-macos-arm64.dmg
            dist/SlowBooksPro-macos-arm64.dmg
            dist/SHA256SUMS.macos
            dist/release-evidence.tar.gz
