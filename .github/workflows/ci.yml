          # 396 with the shards (#1095), unchanged: the sum of the shards' counts.
          MAX_SKIPS: "396"
        run: |
          total=0
          for f in shards/*/skips.txt; do
            n=$(cat "$f"); echo "$f: $n"; total=$((total + n))
          done
          echo "skipped: $total (budget $MAX_SKIPS)"
          if [ "$total" -gt "$MAX_SKIPS" ]; then
            echo "::error::skip count $total exceeds the budget of $MAX_SKIPS — something that used to run is now skipping"
            exit 1
          fi

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      # PR gate. The weekly cron in pip-audit.yml is for catching CVEs
      # disclosed AFTER a release shipped; this step prevents introducing
      # a known-vulnerable dep via PR. Strict mode (no --ignore-vuln) —
      # if a CVE pops up that has no fix yet, add an ignore here with a
      # comment explaining why + tracking ticket.
      - name: Audit requirements.txt
        run: pip-audit --requirement requirements.txt --strict

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    # After lint, beside the tests (#1095). It used to wait for the Linux
    # tests, which only put a minute on the end of every run: the image is
    # built and thrown away here, nothing it makes is used by another job,
    # and a test failure fails the run (and the required checks) all the
    # same.
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t slowbooks-pro-ci:${{ github.sha }} .
      - name: Verify image starts
        run: |
          docker run --rm --entrypoint python slowbooks-pro-ci:${{ github.sha }} \
            -c "import app.main; print('import OK')"
