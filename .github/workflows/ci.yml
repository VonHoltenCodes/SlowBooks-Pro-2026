name: CI

on:
  push:
    branches: [main, server-edition, feat/v2.8, "claude/**", "se/**"]
  pull_request:
    branches: [main, server-edition, feat/v2.8]

# A newer push to a pull request (or a feature branch) cancels the run still
# going for the older one (#1095: several agents pushing at once queued
# 25-minute runs behind each other). A push to main or a release/* branch is
# never cancelled: its group is the run's own id, so no later run shares it.
# (A group that main shared would also drop a QUEUED main run when the next
# push arrived, cancel-in-progress or not.)
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.run_id || github.ref }}
  cancel-in-progress: true

# How the suite is split (#1095). The one-job run had grown to 20-25 minutes
# on Linux and 15-18 on Windows. It now runs as parallel shards of whole test
# FILES (never a file split across jobs: --dist loadfile and the browser
# modules' module-scoped fixtures depend on a file staying in one process),
# balanced on the per-file durations in scripts/ci_test_durations.json.
# scripts/ci_shards.py does the split; a file with no measurement yet is dealt
# round-robin, and each platform's final job reads back every shard's list and
# fails unless together they are every test file exactly once. To refresh the
# durations after a run: gh run download <run-id> -p 'junit-*' -D junit, then
#   python scripts/ci_shards.py refresh --platform linux junit/junit-linux-*/*.xml junit/junit-browser-*/*.xml
#   python scripts/ci_shards.py refresh --platform windows junit/junit-windows-*/*.xml
# and commit the JSON. To change a shard count, edit its matrix list: the
# scripts read the count from strategy.job-total.
#
# Branch protection requires "Test (pytest + coverage)" and "Docker build" by
# name (with Lint, the dependency scan and CodeQL); the per-platform final jobs
# keep those names and need every shard, so the shards themselves are never
# required checks and a shard count can change without touching settings.

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "black>=24.8.0" "ruff>=0.6.0"
      # Whole-tree gate. The earlier allowlist existed because legacy
      # phases (1-3 routes, legacy services) carried pre-black-era style
      # and would have churned on a wholesale widening. The production-
      # readiness sweep formatted everything to black 24.8 / ruff 0.6,
      # so the gate now protects every file from regression — no risk
      # of a new file slipping through unformatted.
      - name: black --check
        run: black --check app/ tests/ scripts/
      - name: ruff check
        run: ruff check app/ tests/ scripts/

  test:
    # One shard of the Linux suite: every test file except the browser
    # modules (those run in test-browser, below, where Chromium is installed;
    # here they would only skip). The required check of this name is the
    # final job, test-linux-gate.
    name: Linux tests ${{ matrix.shard }} of ${{ strategy.job-total }} (pytest + coverage)
    # Pinned: ubuntu-latest began serving 26.04 (resolute) on 2026-10-23,
    # where apt has no `libxml2` candidate and the system-deps step below
    # dies before a test runs. 24.04 is what the suite has run on since
    # the libjpeg note; move it on purpose, with the package list.
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System deps for WeasyPrint + OCR integration tests
        run: |
          sudo apt-get update
          # libjpeg62-turbo was dropped from Ubuntu 24.04 (noble); Pillow
          # ships bundled JPEG support so we don't need a system libjpeg
          # for the runtime path. The remaining packages are what
          # WeasyPrint's cairo/pango stack pulls in.
          # tesseract-ocr + poppler-utils are needed for the integration
          # tests in tests/test_ocr_integration.py (real OCR pipeline).
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev \
            libxml2 libxslt1.1 \
            tesseract-ocr poppler-utils
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: This shard's test files
        run: |
          python scripts/ci_shards.py list --group core --platform linux \
            --shard ${{ matrix.shard }} --of ${{ strategy.job-total }} --out shard-files.txt
          wc -l shard-files.txt
      - name: Run pytest with coverage
        # One worker per runner core (#770): the suite had grown to 33 to 38
        # minutes run serially, most of it the migration walks and the browser
        # sweeps, which are CPU-bound and independent. loadfile keeps each
        # test file on one worker: 17 minutes against 33 serial. worksteal,
        # which hands tests out one at a time, was tried and is slower here
        # (21 minutes): the browser files' module-scoped fixtures (a Chromium,
        # the seeded books) are built again on every worker that takes a
        # test from the file, and with four of those running at once
        # Tesseract starved past its 20 s limit in the OCR tests. conftest
        # gives every worker its own scratch data folder and migration
        # cache. pytest-cov combines the workers' coverage by itself.
        # Since #1095 the files are split across the shards above, and each
        # shard still runs its share one worker per core with loadfile; the
        # coverage of the shards is combined in test-linux-gate.
        env:
          # Quoted because the value contains colons (sqlite:///:memory:)
          # — unquoted, YAML mis-parses "sqlite:" as a nested mapping key
          # and the entire workflow fails validation at startup.
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_SECRET_KEY: ci-secret-key
          RATE_LIMIT_ENABLED: "0"
          # Tesseract is built with OpenMP and takes every core for each
          # run; with four workers and their Chromiums on four cores, one
          # OCR test in three runs starved past the service's 20 s limit.
          # One thread per Tesseract, as its own documentation says for
          # several at once; the images here are small and read in well
          # under a second either way.
          OMP_THREAD_LIMIT: "1"
        run: |
          nproc
          # --durations=40: each shard's slowest, so a slow test shows (#1095)
          pytest @shard-files.txt -n auto --dist loadfile --durations=40 \
            --cov=app --cov-report= \
            --junitxml=junit.xml -o junit_family=xunit1
          mv .coverage .coverage.linux-${{ matrix.shard }}
      - name: Upload this shard's coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-${{ matrix.shard }}
          path: .coverage.linux-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 3
      - name: Upload this shard's file list and timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-linux-${{ matrix.shard }}
          path: |
            shard-files.txt
            junit.xml
          retention-days: 14

  test-linux-gate:
    # The required check (branch protection names it): every Linux shard
    # passed, together they ran every non-browser test file once, and their
    # coverage, combined, is the report the one job used to print.
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install coverage
        run: pip install "coverage>=7.5"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-linux-*
          path: shards
      - name: The shards ran every test file once
        run: python scripts/ci_shards.py verify --group core shards/*/shard-files.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-linux-*
          merge-multiple: true
          path: .
      - name: Combine coverage
        run: |
          coverage combine .coverage.linux-*
          coverage report -m
          coverage xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The browser modules in Playwright's Chromium (#1095).
  #
  # Until this job, no CI run executed a browser test: Playwright is not in
  # requirements-dev.txt, so every module that starts with
  # pytest.importorskip("playwright.sync_api") skipped as one, and 17 of them
  # were failing on main unseen. They are selected by that import
  # (scripts/ci_shards.py --group browser), never by a list, so a new browser
  # module runs here without anyone naming it. Playwright stays out of
  # requirements-dev.txt on purpose: Windows would then try to run the
  # browser modules, and its skip budget counts them as skips.
  #
  # The keyboard, read-only, contrast and field-name sweeps stay whole: a
  # module is never split, only whole modules dealt to shards.
  #
  # A browser module that skips here means Chromium did not start, so a skip
  # naming playwright fails the shard rather than passing it quietly.
  # ---------------------------------------------------------------------------
  test-browser:
    name: Browser tests ${{ matrix.shard }} of ${{ strategy.job-total }} (Playwright)
    runs-on: ubuntu-24.04
    needs: lint
    env:
      PLAYWRIGHT_VERSION: "1.60.0"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev \
            libxml2 libxslt1.1 \
            tesseract-ocr poppler-utils
      - name: Install deps and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "playwright==$PLAYWRIGHT_VERSION"
      - name: Which browsers the modules launch
        # Chromium always; WebKit only once a module launches it (the Find
        # on this screen WebKit module, #1092), so no one has to remember
        # to add it here
        id: engines
        run: |
          engines=chromium
          if grep -lqE '\.webkit\.launch\(' tests/test_*.py; then engines="chromium webkit"; fi
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "key=${engines// /-}" >> "$GITHUB_OUTPUT"
          echo "engines: $engines"
      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ steps.engines.outputs.key }}
      - name: Install the browsers and their system libraries
        run: python -m playwright install --with-deps ${{ steps.engines.outputs.engines }}
      - name: This shard's browser modules
        run: |
          python scripts/ci_shards.py list --group browser --platform linux \
            --shard ${{ matrix.shard }} --of ${{ strategy.job-total }} --out shard-files.txt
          cat shard-files.txt
      - name: Run the browser modules
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_SECRET_KEY: ci-secret-key
          RATE_LIMIT_ENABLED: "0"
          OMP_THREAD_LIMIT: "1"
        run: |
          nproc
          pytest @shard-files.txt -n auto --dist loadfile --durations=20 \
            --junitxml=junit.xml -o junit_family=xunit1
      - name: No browser module skipped for want of Chromium
        run: python scripts/ci_shards.py skips --fail-on playwright junit.xml
      - name: Upload this shard's file list and timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-browser-${{ matrix.shard }}
          path: |
            shard-files.txt
            junit.xml
          retention-days: 14

  test-browser-gate:
    # One stable name for branch protection, whatever the shard count.
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: test-browser
    if: always()
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.test-browser.result }}"
          test "${{ needs.test-browser.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-browser-*
          path: shards
      - name: The shards ran every browser module once
        run: python scripts/ci_shards.py verify --group browser shards/*/shard-files.txt

  # ---------------------------------------------------------------------------
  # The suite on Windows (issue #121).
  #
  # Why this job exists: pytest ran on Linux only, and the Windows build
  # workflow never ran the suite at all. A reader on Windows found eight tests
  # that failed there and nowhere else (#119, note 2) — an encoding class that
  # was green on every pull request and broken for anyone on that platform.
  #
  # It became possible once WeasyPrint's import went lazy: importing the app no
  # longer needs pango/cairo/gobject, so no GTK staging is required here. And it
  # became green once six portability defects in the tests were fixed, plus one
  # real product bug they were reporting honestly (attachment paths stored with
  # the platform separator).
  #
  # Deliberately WITHOUT tesseract and poppler. The Linux job installs both and
  # runs the OCR integration tests; this job is here to catch platform
  # assumptions — path separators, executable formats, `sys.platform` — and a
  # smaller surface makes it faster and less prone to unrelated breakage. The
  # skip count is therefore higher here than on Linux by design. If it changes,
  # something changed in the suite, not in the runner.
  #
  # Verified on real Windows before wiring: 2030 tests, 0 failed, 65 skipped.
  #
  # Since #1095 it runs as shards (test-windows, a matrix) and a final job of
  # the old name (test-windows-gate) that sums their skips against the budget.
  # ---------------------------------------------------------------------------
  test-windows:
    name: Windows tests ${{ matrix.shard }} of ${{ strategy.job-total }} (portability)
    runs-on: windows-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Keep Defender's real-time scan off the test tree
        # The suite is file-bound here (SQLite company files, migrations
        # walked on a real file, PDFs): Defender scanning every write is
        # what made this job take 30 to 40 minutes. The exclusions cover the
        # checkout, the runner's temp (pytest's tmp_path) and the Python
        # install; the runner is thrown away after the job.
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", (Split-Path -Parent (Get-Command python).Source)
          (Get-MpPreference).ExclusionPath
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-timeout
      - name: This shard's test files
        run: |
          python scripts/ci_shards.py list --group all --platform windows --shard ${{ matrix.shard }} --of ${{ strategy.job-total }} --out shard-files.txt
      - name: Run pytest, and count its skips
        # The skip budget is enforced in test-windows-gate, below, on the
        # sum of every shard's count; each shard writes its own here.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_SECRET_KEY: ci-secret-key
          RATE_LIMIT_ENABLED: "0"
        shell: pwsh
        run: |
          # -v names each test as it starts, so a mid-run death is identified
          # in the log rather than guessed at. The timeout is generous because
          # the alembic migration tests walk 36 migrations against a real file
          # and take ~3 s on Linux but far longer here — a Windows runner's
          # file I/O with real-time scanning was the difference before the
          # Defender exclusions above. 120 s catches a genuine hang without
          # failing an honestly slow test (the slowest test here is well under
          # a minute).
          # one worker per core here too (#770): 14 minutes against 22
          # serial. worksteal suits this job, which has no browser tests
          # (no Playwright) and no Tesseract to starve; each worker has its
          # own scratch folder and migration cache, and the skip budget
          # reads the same summary line, shard by shard (#1095).
          pytest "@shard-files.txt" -q -n auto --dist worksteal --timeout=120 --tb=short --junitxml=junit.xml -o junit_family=xunit1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = ($out | Select-String -Pattern '\d+ passed').Line
          Write-Host "summary: $line"
          $skips = 0
          if ($line -match '(\d+) skipped') { $skips = [int]$Matches[1] }
          Write-Host "skipped in this shard: $skips"
          Set-Content -Path skips.txt -Value $skips -NoNewline
      - name: Upload this shard's skips, file list and timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-windows-${{ matrix.shard }}
          path: |
            shard-files.txt
            skips.txt
            junit.xml
          retention-days: 14

  test-windows-gate:
    name: Test on Windows (portability)
    runs-on: ubuntu-latest
    needs: test-windows
    if: always()
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.test-windows.result }}"
          test "${{ needs.test-windows.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-windows-*
          path: shards
      - name: The shards ran every test file once
        run: python scripts/ci_shards.py verify --group all shards/*/shard-files.txt
      - name: Refuse a quiet rise in skips
        # A portability job's worst failure mode is staying green while
        # covering less, so the skip count is a budget rather than a
        # curiosity. 65 is what real Windows produced when this was wired
        # (macOS-only tests, and the OCR/PDF paths whose binaries this image
        # deliberately does not carry). A rise means something started
        # skipping that used to run — investigate before raising the number.
        # The budget is the whole suite's: since #1095 the Windows suite runs
        # as shards, each writes its own count (skips.txt), and this step sums
        # them. To raise it, bump MAX_SKIPS below, here, with a line saying
        # which tests skip and why.
        env:
          # 90 observed at 2.18.0: the explore-2.17.3 fixes added PDF tests (bills, purchase
          # orders, credit memos, reconciliation reports, tax forms, report footers, the
          # invoice header, emailed statements) that skip where WeasyPrint's native stack
          # is absent, as this image is by design. 74 before them; room for one more guard.
          # +3: tests/test_theme_contrast.py, tests/test_dialog_contrast.py and
          # tests/test_readonly_browser.py each skip as one module without playwright, as
          # tests/test_browser_ui.py does.
          # +1: tests/test_field_names.py (#198) skips as one module without playwright too.
          # +1: tests/test_combobox.py (type-ahead pickers), the same.
          # +1: tests/test_active_lists_browser.py (#210 Active/Inactive lists), the same.
          # +2: tests/test_vendor_page.py (#223 the vendor page) and
          # tests/test_bill_edit_browser.py (#225 editing a posted bill), the same.
          # +11 for 2.22.0: five Chromium modules (test_browser_report_views,
          # test_browser_grid, test_browser_classes, test_browser_class_filters,
          # test_browser_report_links) at one each, test_theme_contrast's second
          # module-level skip, and five new PDF tests that need WeasyPrint's
          # native stack (the by-class, by-job and class P&L exports).
          # Round 2: -1 (tests/test_report_links.py no longer skips without
          # Playwright: its books fixture lives in conftest), +1
          # tests/test_browser_keyboard.py, +1 tests/test_browser_job_picker.py,
          # +1 a PDF test of the round-2 exports (WeasyPrint's native stack).
          # 2.22.2: +1 the deposit slip's real-PDF test (#260), which the
          # WeasyPrint hook skips here as it does the other PDF tests.
          # 2.22.3: +1 PR #283's source-run process pair, POSIX-only (#121);
          # its Windows counterpart runs here (W-7).
          # 2.23.1: +1 the bill form's browser measurement (W-5), one more
          # playwright module, skipped here as its sixteen siblings are.
          # 119 since 2.24.0: tests/test_browser_open_tabs.py joins the browser
          # modules that skip here without playwright's Chromium; 120 with
          # 2.24.0's round 2: the Closing Date Exceptions clock test renders
          # the report's PDF, which skips here with the other PDF tests
          # (no WeasyPrint stack on the runner)
          # 2.24.0's round 4: the invitation's browser test, skipped like
          # the other Playwright modules (no Playwright on the runner)
          # 125 with printed register checks: four tests in
          # tests/test_register_check_print.py render the check's PDF, which
          # skips here with the other PDF tests (no WeasyPrint stack)
          # 126 with atomic account balances: the concurrent-postings race
          # in tests/test_atomic_account_balance.py needs a Postgres server
          # (SLOWBOOKS_TEST_POSTGRES_URL), like the other Postgres-only tests
          # 141 for 2.27.0, the count on the integrated tree's own Windows run
          # (CI 40031366864): each PR raised it from 126 on its own base.
          # 146 for 2.28.0, the count on the integrated tree's own Windows run:
          # the account detail types add Postgres-only migration tests.
          # 153 for 2.29.0, the count on the integrated tree's own Windows run
          # (CI 40105648413: 4,964 passed, 153 skipped): opening YTD by
          # quarter's Postgres-only migration test, the past-customers labels
          # PDF without WeasyPrint, item quick-add's and #457's Playwright
          # modules, each PR having raised it from 146 on its own base.
          # 154 with PR #470's fix commit (CI 40109192190: 4,988 passed, 154
          # skipped): tests/test_past_customers.py's five-line label test
          # renders the labels PDF, which skips here with the other PDF tests
          # (no WeasyPrint stack on the runner).
          # 159 with the pre-printed check stock (#440): five tests render a
          # check PDF (tests/test_check_stock.py's three test-print tests, the
          # API sweep reaching GET /api/checks/test-print, and the bookkeeper
          # "server answers" sweep), which skip here with the other PDF tests
          # (no WeasyPrint stack on the runner) — 154 + 5.
          # 179 for 2.29.1, read from the integrated tree's own Windows run
          # (40144051517 on cfb16f33: 5,243 passed, 179 skipped; 2.29.0 had
          # 154). The 25 new skips: thirteen new Playwright modules
          # (test_browser_ account_quick_add, bill_quick_entry, enter_moves,
          # feed_vendor, new_lines_taxable, pl_columns, pl_detail,
          # pl_total_drill, quick_entry_add_customer, report_refresh,
          # review_account_quick_add, transaction_warnings, vendor_bank_rule),
          # the four Postgres-only tests of
          # test_postgres_races_501.py (no SLOWBOOKS_TEST_POSTGRES_URL here),
          # and eight new PDF tests (P&L Detail, the month / quarter grid, the
          # check test print and pre-printed stock) that skip with the other
          # PDF tests (no WeasyPrint stack on the runner).
          # 180 with the vendor card's payments browser test
          # (test_browser_vendor_payments_card.py, no Playwright here; read
          # from 40159680023 on 7ebfc826: 5,249 passed, 180 skipped).
          # 181 with the Contact support form's browser test
          # (test_browser_support_form.py, no Playwright here — one module,
          # skipped like its siblings without the runner's Chromium).
          # 182 with the register date's browser test
          # (test_browser_register_date.py, no Playwright here — one module,
          # skipped like its siblings without the runner's Chromium).
          # 183 with the lien waiver PDF route test (#576,
          # test_pay_applications::test_lien_waiver_pdf_route, WeasyPrint's
          # native stack is not on the runner).
          # 185 with the job-report PDF tests (#577,
          # test_job_reports::test_report_routes_pdf and
          # ::test_existing_reports_export_pdf, WeasyPrint again).
          # 186 with the Trial Balance PDF test (#614,
          # test_trial_balance_balances::test_the_pdf_and_csv_carry_the_same_figures,
          # WeasyPrint again).
          # 188 with the deposit-line donor tests, 189 with the batch check
          # PDF test (#628, test_check_batch_print, WeasyPrint); 192 for 2.30.0:
          # the integrated tree's own Windows run measured 189 plus the three
          # widths of tests/test_browser_topbar_width.py, which needs Playwright
          # and so skips here like the other browser tests)
          # (test_deposit_split_names.py::test_one_deposit_of_two_gifts_counts_for_each_donor_and_a_void_drops_out
