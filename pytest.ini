[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --disable-warnings
markers =
    timeout: per-test time budget in seconds (pytest-timeout reads it where installed; registered here so the marker collects everywhere)
    integration: tests requiring real system binaries (tesseract, poppler-utils)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
